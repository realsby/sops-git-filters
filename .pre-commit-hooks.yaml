# Hook manifest so this repo can be consumed directly by pre-commit:
#
#   repos:
#     - repo: https://github.com/realsby/sops-git-filters
#       rev: v3.1.0   # sops-file-permissions exists from v1.1.0 (v1.0.0 ships the guard only)
#       hooks:
#         - id: sops-encryption-guard
#         - id: sops-file-permissions
#
# Note: the guard is the SECOND line of defense. The first (the
# clean/smudge filters) still needs install.sh run once per clone —
# see README.md.
- id: sops-encryption-guard
  name: Verify SOPS-managed files are staged encrypted
  entry: encryption-guard.sh
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

# Re-applies mode 0600 to every filter=sops file. install.sh already
# installs plain hooks that do this (post-checkout, post-merge,
# post-rewrite, post-applypatch, post-commit); use this entry instead if
# you manage all hook types through pre-commit. It needs
# `pre-commit install -t post-checkout -t post-merge -t post-rewrite -t post-commit`,
# or `default_install_hook_types: [pre-commit, post-checkout, post-merge,
# post-rewrite, post-commit]` in .pre-commit-config.yaml. pre-commit has
# no post-applypatch stage, so `git am` is not covered this way. Running
# both is harmless — the script is idempotent.
- id: sops-file-permissions
  name: Tighten permissions on SOPS-managed files (0600)
  entry: harden-permissions.sh
  args: ['--quiet']
  language: script
  pass_filenames: false
  always_run: true
  stages: [post-checkout, post-merge, post-rewrite, post-commit]
