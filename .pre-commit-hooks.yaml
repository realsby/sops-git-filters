# Hook manifest so this repo can be consumed directly by pre-commit:
#
#   repos:
#     - repo: https://github.com/realsby/sops-git-filters
#       rev: v2.0.0   # sops-file-permissions exists from v1.1.0 (v1.0.0 ships the guard only)
#       hooks:
#         - id: sops-encryption-guard
#         - id: sops-file-permissions
#
# Note: the guard is the SECOND line of defense. The first (the
# clean/smudge filters) still needs install.sh run once per clone —
# see README.md.
- id: sops-encryption-guard
  name: Verify SOPS-managed files are staged encrypted
  entry: encryption-guard.sh
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

# Re-applies mode 0600 to every filter=sops file. install.sh already
# installs plain post-checkout/post-merge hooks that do this; use this
# entry instead if you manage all hook types through pre-commit (it
# needs `pre-commit install -t post-checkout -t post-merge`, or
# `default_install_hook_types: [pre-commit, post-checkout, post-merge]`
# in .pre-commit-config.yaml). Running both is harmless — the script is
# idempotent.
- id: sops-file-permissions
  name: Tighten permissions on SOPS-managed files (0600)
  entry: harden-permissions.sh
  args: ['--quiet']
  language: script
  pass_filenames: false
  always_run: true
  stages: [post-checkout, post-merge]
