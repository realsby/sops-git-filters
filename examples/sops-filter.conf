# Copy into your repo root as `.sops-filter.conf` (optional).
# Selects how encrypted blobs are STORED in git. Pick once, before the
# first encrypted commit — changing it later requires re-encrypting
# every managed file (see README: "Migrating between formats").
#
#   json   (default) — works for any text file. Stored as a SOPS JSON
#          document; the whole file body is one encrypted string.
#
#   dotenv — for KEY=value files only. Key names and comments stay
#          readable in git; only values are encrypted. Required if a
#          deploy tool (e.g. doco-cd) decrypts .env files natively by
#          extension. Caveat: the dotenv format cannot represent blank
#          lines — use lone '#' separator lines instead.
SOPS_STORE_FORMAT=json

# Permission mode applied to every filter=sops file in the working tree
# by harden-permissions.sh (install.sh + the post-checkout/post-merge
# hooks). Git cannot store 0600, so without this the smudge filter
# recreates secrets with your umask — 0644 on most workstations.
# Default is 600. Widen it only if a second local account must read the
# decrypted files, and record why in a comment line ABOVE the setting —
# the value is read verbatim after '=', so an inline '# comment' or
# quotes make it invalid.
SOPS_FILE_MODE=600
