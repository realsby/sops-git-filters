# Copy into your repo root as `.sops-filter.conf` (optional).
# Selects how encrypted blobs are STORED in git. Pick once, before the
# first encrypted commit: changing it later requires re-encrypting
# every managed file (see README: "Storage formats: json vs dotenv").
#
#   json   (default): works for any text file. Stored as a SOPS JSON
#          document; the whole file body is one encrypted string.
#
#   dotenv: for KEY=value files only. Key names stay readable in git;
#          values and comments are encrypted. Required if a deploy
#          tool (e.g. doco-cd) decrypts .env files natively by
#          extension. The dotenv format cannot represent blank lines:
#          use lone '#' separator lines instead.
SOPS_STORE_FORMAT=json

# Permission mode applied to every filter=sops file in the working tree
# by harden-permissions.sh, which install.sh runs once and the five
# permission hooks it writes run again (post-checkout, post-merge,
# post-rewrite, post-applypatch, post-commit). Git cannot store 0600,
# so without this the smudge filter recreates secrets with your umask
# (0644 on most workstations).
# Default is 600. A file tracked as executable (100755) also gets the
# owner execute bit (600 -> 700, 640 -> 740), so git sees no mode change.
# Only owner and group bits are allowed: a setuid, setgid or sticky digit
# or any bit for others is refused, and the files then get 600 while the
# script reports the error. Widen it (e.g. 640) only if a second local
# account must read the decrypted files, and record why in a comment
# line ABOVE the setting: the value is read verbatim after '=', so an
# inline '# comment' or quotes make it invalid.
SOPS_FILE_MODE=600
